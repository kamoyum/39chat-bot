演／一般口述2／一般口述3／サテライト中継、14:10 教育講演Ⅰ／一般口述1（セレクション）／一般口述4／一般口述5／ポスター発表1、15:20 シンポジウムⅠ／Pros Cons／一般口述6／一般口述7／ポスター発表2、16:30 一般口述8／一般口述9、17:00 教育講演Ⅱ・Ⅲ、18:30 レセプションです。[Image 1]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q042", "category": "カテゴリ2：プログラム・講演セッション", "type": "事実回答", "question": "学会の2日目（8月30日）全体の流れを教えてください。", "aliases": ["学会の2日目（8月30日）全体の流れをはどこですか。", "「学会の2日目（8月30日）全体の流れを教えてください。」の詳細を知りたい。", "学会の2日目（8月30日）全体の流れについて。"], "answer": "2日目（8月30日）の主な流れは、8:00 モーニングセミナー、9:10 特別講演／一般口述10／一般口述11／ポスター発表3、10:20 一般口述12／一般口述13／ポスター発表4、10:50 シンポジウムⅡ、11:30 一般口述14／一般口述15／ポスター発表5、12:30 企業ミニレクチャー、13:20 基幹シンポジウム、15:00 閉会式です。[Image 2]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q043", "category": "カテゴリ2：プログラム・講演セッション", "type": "事実回答", "question": "2日目の閉会式で行われる「第40回学会長 挨拶」とは何ですか？", "aliases": ["閉会式は何時ですか", "クロージングはいつですか", "閉会式の場所"], "answer": "閉会式の最後に、次回大会（第40回中国ブロック理学療法士学会）の学会長より就任の挨拶が行われます。[Image 2]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q044", "category": "カテゴリ2：プログラム・講演セッション", "type": "事実回答", "question": "1日目の午前中に中国ブロック理学療法士会や連盟の会議はありますか？", "aliases": ["1日目の午前中に中国ブロック理学療法士会や連盟の会議はありますか？", "「1日目の午前中に中国ブロック理学療法士会や連盟の会議はありますか？」の詳細を知りたい。", "1日目の午前中に中国ブロック理学療法士会や連盟の会議はありますか？"], "answer": "はい。11:00〜12:00に、第3会場で「中国ブロック理学療法士会 協議会理事会」、第6会場で「中国ブロック理学療法士連盟 会議」が開催されます。[Image 1]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q045", "category": "カテゴリ2：プログラム・講演セッション", "type": "事実回答", "question": "2日目の午前中に生涯学習や組織運営に関係する会議はありますか？", "aliases": ["2日目の午前中に生涯学習や組織運営に関係する会議はありますか？", "「2日目の午前中に生涯学習や組織運営に関係する会議はありますか？」の詳細を知りたい。", "2日目の午前中に生涯学習や組織運営に関係する会議はありますか？"], "answer": "はい。8:00〜10:40に第6会場で「【新規】生涯学習担当者会議」、10:50〜12:20に第6会場で「中国ブロック理学療法士会連絡協議会 働き方・就労に関する部門担当者会議」が開催されます。[Image 2]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q046", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "会場内の「休憩スペース」はどこですか？", "aliases": ["休憩スペース", "会場内の休憩場所", "企業展示休憩スペース"], "answer": "プログラム上は「企業展示・休憩スペース」の案内があります。詳細な配置は当日配布資料や会場案内をご確認ください。[Image 1, Image 2]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q047", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "一般演題の募集期間はいつからいつまででしたか？", "aliases": ["演題登録はいつまででしたか", "演題の応募締め切り", "演題登録期間"], "answer": "2026年2月2日（月）〜4月19日（日）に実施され、現在は終了しています。[25]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q048", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "演題の応募資格について教えてください。", "aliases": ["演題を出せるのは誰ですか", "演題の応募条件", "発表者の資格"], "answer": "筆頭演者は、中国ブロック（広島県、鳥取県、山口県、島根県、岡山県）に所属する日本理学療法士協会の会員に限ります。[26]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q049", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "入会手続き中の場合、演題登録時の会員番号の入力はどうすればよいですか？", "aliases": ["入会手続き中の場合、演題登録時の会員番号の入力はどうすればよいについてはどこですか。", "「入会手続き中の場合、演題登録時の会員番号の入力はどうすればよい」の詳細を知りたい。", "入会手続き中の場合、演題登録時の会員番号の入力はどうすればよいですか？"], "answer": "入会手続き中の方は、会員番号欄に「000000」と入力して登録を行ってください。[27]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q050", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "発表形式にはどのような種類がありますか？", "aliases": ["発表方法はどのような種類がありますか", "口述かポスターか", "発表スタイルについて"], "answer": "一般演題として「口述発表」と「ポスター発表」の2種類があります。[27]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q051", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "口述発表の発表時間および質疑応答時間は何分ですか？", "aliases": ["口述の発表時間は何分ですか", "スピーチの時間と質疑応答時間", "口述発表のルール"], "answer": "発表時間は7分、質疑応答時間は3分（計10分）です。[27]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q052", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "ポスター発表はどのような形式で行われますか？", "aliases": ["ポスター発表のやり方", "ポスターの形式", "ポスター発表の詳細"], "answer": "ポスター発表は現地会場での「フリーディスカッション形式」で実施されます。[27]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q053", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "採択された演題数はそれぞれ何演題ですか？", "aliases": ["採択された演題の数", "一般演題の数はいくつですか", "何演題ありますか"], "answer": "口述発表は O1-1〜O15-6 の計90演題、ポスター発表は P1-1〜P5-10/11 の計52演題です。口述は15セッション、ポスターは5セッションで構成されています。\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q054", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "ポスターの貼り付け・発表・撤去の時間帯を教えてください。", "aliases": ["ポスターを貼る時間はいつですか", "ポスターの撤去時間", "ポスターのスケジュール"], "answer": "タイムテーブル上は以下の通りです。[Image 1, Image 2]\n- 貼り付け：1日目（8月29日）12:00〜14:10\n- 発表：1日目（ポスター発表1：14:10〜15:10、ポスター発表2：15:20〜16:20）および2日目（ポスター発表3：9:10〜10:10、ポスター発表4：10:20〜11:20、ポスター発表5：11:30〜12:30）\n- 撤去：2日目（8月30日）12:30頃〜13:00\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q055", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "口述発表やポスター発表はどこの会場で行われますか？", "aliases": ["口述の発表時間は何分ですか", "スピーチの時間と質疑応答時間", "口述発表のルール"], "answer": "口述発表は、第2会場（小ホール：一般口述1［セレクション］）、第3会場（501：一般口述2・4・6・8・10・12・14）、第5会場（601：一般口述3・5・7・9・11・13・15）で行われます。ポスター発表はすべて第4会場（多目的ホール）です。[Image 1, Image 2]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q056", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "演題の審査（査読）結果はいつ頃届きますか？", "aliases": ["演題の審査（査読）結果はいつ頃届きますか？", "「演題の審査（査読）結果はいつ頃届きますか？」の詳細を知りたい。", "演題の審査（査読）結果はいつ頃届きますか？"], "answer": "2026年6月中旬までにご連絡する予定となっています。[29]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q057", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "演題の登録方法について教えてください。", "aliases": ["演題の登録方法についてはどこですか。", "「演題の登録方法について教えてください。」の詳細を知りたい。", "演題の登録方法について教えてください。"], "answer": "インターネットを利用した演題登録システム（A-Pass/Confitアカウント経由）によるオンライン登録のみです。郵送等の受付はありません。[26, 30]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q058", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "抄録の文字数制限（演題名、本文）を教えてください。", "aliases": ["抄録の文字数制限（演題名、本文）をはどこですか。", "「抄録の文字数制限（演題名、本文）を教えてください。」の詳細を知りたい。", "抄録の文字数制限（演題名、本文）について。"], "answer": "演題名は50文字以内（副題を含む）、抄録本文は1,200文字以内（全角1文字、半角0.5文字換算）です。[32, 33]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q059", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "抄録本文に図や表を掲載することは可能ですか？", "aliases": ["抄録本文に図や表を掲載することは可能についてはどこですか。", "「抄録本文に図や表を掲載することは可能」の詳細を知りたい。", "抄録本文に図や表を掲載することは可能ですか？"], "answer": "いいえ、図表は掲載できません。テキストデータのみの登録となります。[34]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q060", "category": "カテゴリ3：演題募集・発表者向け", "type": "事実回答", "question": "抄録本文の文章構成（小見出し）に指定はありますか指定を教えてください。", "aliases": ["抄録本文の文章構成（小見出し）に指定はありますか指定をはどこですか。", "「抄録本文の文章構成（小見出し）に指定はありますか指定を教えてください。」の詳細を知りたい。", "抄録本文の文章構成（小見出し）に指定はありますか指定について。"], "answer": "発表形式に応じて、以下を参考に構造化してください（小見出しも文字数に含みます）。[33]\n- 研究発表：【はじめに】【対象と方法】【結果】【考察】【結語】\n- 症例報告：【はじめに】【症例紹介】【経過】【考察】【結語】\n- 活動報告：【はじめに】【活動状況】【今後の課題】\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q061", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "発表時に利益相反（COI）の開示は必要ですか？抄録への記載は必要ですか？", "aliases": ["COIの開示方法", "利益相反の申告は必要ですか", "COIについて教えてください"], "answer": "採択された演題は、発表時に利益相反（COI）に関する開示が必要ですが、抄録への記載は不要です。[29]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q062", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "事前参加登録はいつから開始されましたか？", "aliases": ["いつから申し込めますか", "事前登録の開始時期", "参加登録はいつから"], "answer": "2026年6月1日（月）から受付が開始されました。[15]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q063", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "事前参加登録をすると、どのようなメリットがありますか？", "aliases": ["いつから申し込めますか", "事前登録の開始時期", "参加登録はいつから"], "answer": "事前申し込みをいただいた参加者の皆様には、抄録集の閲覧やプログラムの最新情報を優先的にお届けいたします。[39]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q064", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "参加費（事前参加）はいくらですか？区分ごとに教えてください。", "aliases": ["参加料金はいくらですか", "いくらかかりますか", "登録料を教えてください"], "answer": "事前参加登録の料金は以下の通りです。[14]\n- 中国ブロック会員：5,000円\n- 他ブロック会員：6,000円\n- 理学療法士（PT）非会員：12,000円\n- 他職種：8,000円\n- 学生：無料\n※学生無料は、免許を有しない養成施設の学生等に限ります。免許を取得している大学院生は一般参加扱いです。\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q065", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "当日参加（およびオンデマンド参加）の参加費はいくらですか？", "aliases": ["当日参加の参加費", "オンデマンド参加の参加費", "当日料金"], "answer": "当日参加（オンデマンド参加も同額）の料金は以下の通りです。[14]\n- 中国ブロック会員：6,000円\n- 他ブロック会員：7,000円\n- 理学療法士（PT）非会員：15,000円\n- 他職種：8,000円\n- 学生：無料\n※学生無料は、免許を有しない養成施設の学生等に限ります。免許を取得している大学院生は一般参加扱いです。\n※当日参加は現地決済のみです。\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q066", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "大学院生ですが、学生の無料参加区分に入りますか？", "aliases": ["学生は無料ですか", "大学院生も無料ですか", "学生の参加資格について"], "answer": "いいえ。免許を取得している大学院生については一般参加の扱いとなります（学生無料枠は、免許を有しない養成施設の学生等に限られます）。[14]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q067", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "現地参加する場合、オンデマンド視聴用の登録も別途行う必要がありますか？", "aliases": ["現地参加でオンデマンドも見られますか", "オンデマンドの追加登録は必要ですか", "現地参加とオンデマンド"], "answer": "いいえ。現地での参加登録をいただいた方は、追加の手続きを行うことなく自動的にオンデマンド視聴も可能となります。[14]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q068", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "対面参加（現地参加）を希望する場合の事前申込期限を教えてください。", "aliases": ["現地参加の申込期限", "対面参加の締切", "現地参加の締切"], "answer": "お支払い方法によって期限が異なります。[15]\n- 口座振替：2026年7月27日（月）まで\n- 現金振込：2026年8月4日（火）まで\n- クレジットカード決済：2026年8月23日（日）まで\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q069", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "オンデマンド参加のみを希望する場合の事前申込期限を教えてください。", "aliases": ["オンデマンド参加の申込期限", "オンデマンドの締切", "オンデマンド申込期限"], "answer": "お支払い方法によって期限が異なります。[15]\n- 口座振替：2026年8月15日（土）まで\n- 現金振込：2026年8月18日（火）まで\n- クレジットカード決済：2026年9月6日（日）まで\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q070", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "日本理学療法士協会会員の参加申し込み手順を教えてください。", "aliases": ["日本理学療法士協会会員の参加申し込み手順をはどこですか。", "「日本理学療法士協会会員の参加申し込み手順を教えてください。」の詳細を知りたい。", "日本理学療法士協会会員の参加申し込み手順について。"], "answer": "協会ホームページ内のマイページにログインし、「生涯学習管理」→「セミナー検索・申込」より、セミナー番号を検索して申し込みます。お間違いのないよう選択してください。[16]\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q071", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "理学療法士協会会員のセミナーIDと講義番号を教えてください。", "aliases": ["理学療法士協会会員のセミナーIDと講義番号をはどこですか。", "「理学療法士協会会員のセミナーIDと講義番号を教えてください。」の詳細を知りたい。", "理学療法士協会会員のセミナーIDと講義番号について。"], "answer": "日本理学療法士協会会員向けのセミナーID・講義番号は以下の通りです。[16]\n- 対面参加（ブロック学会会員外）：セミナーID 287103 ／ 講義番号 159805\n- 対面参加（ブロック学会会員）：セミナーID 287104 ／ 講義番号 159806\n- オンデマンド参加（ブロック学会会員外）：セミナーID 287106 ／ 講義番号 159807\n- オンデマンド参加（ブロック学会会員）：セミナーID 287107 ／ 講義番号 159808\n\n💡 解決しない場合や個別のご相談は、学会公式ホームページ（ https://39cbpt.gakujyutsuweb.net/ ）の「お問い合わせ」より事務局へご連絡ください。\n\n---"}, {"id": "Q072", "category": "カテゴリ4：参加申し込み・手続き", "type": "事実回答", "question": "会員外、休会者、学生の事前申込方法と期限を教えて function escapeHtml(v){ return String(v || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
function nl2br(v){ return escapeHtml(v).replace(/\n/g,'<br>'); }
function applyRouteFromHash(){
  const raw=(window.location.hash || '').replace(/^#/, '');
  if(!raw) return;
  const params=new URLSearchParams(raw.includes('=') ? raw : 'tab='+raw);
  const tab=params.get('tab');
  if(VALID_TABS.includes(tab)) state.tab=tab;
  const day=params.get('day');
  if(day && DAY_MAP[day]) state.date=DAY_MAP[day];
  const floor=params.get('floor');
  if(floor && VALID_FLOORS.includes(floor)) state.floor=floor;
  const faqCategory=params.get('faqCategory');
  if(faqCategory) state.faqCategory=faqCategory;
  const q=params.get('q');
  if(q !== null) state.globalSearch=q;
}
function updateHash(){
  const params=new URLSearchParams();
  params.set('tab', state.tab);
  if(['schedule','favorites','map','abstracts'].includes(state.tab)) params.set('day', state.date===DAY_MAP['2'] ? '2' : '1');
  if(state.tab==='map' && VALID_FLOORS.includes(state.floor)) params.set('floor', state.floor);
  if(state.tab==='faq' && state.faqCategory !== 'all') params.set('faqCategory', state.faqCategory);
  if(state.globalSearch && state.globalSearch.trim()) params.set('q', state.globalSearch.trim());
  const nextHash='#'+params.toString();
  if(window.location.hash !== nextHash && window.history && window.history.replaceState){
    window.history.replaceState(null, '', nextHash);
  }
}
function jumpToTab(tab, options){
  options = options || {};
  if(VALID_TABS.includes(tab)) state.tab=tab;
  if(options.day && DAY_MAP[String(options.day)]) state.date=DAY_MAP[String(options.day)];
  if(options.floor && VALID_FLOORS.includes(options.floor)) state.floor=options.floor;
  if(typeof options.q === 'string') state.globalSearch=options.q;
  render();
}

function ensureToast(){ let el=document.getElementById('appToast'); if(!el){ el=document.createElement('div'); el.id='appToast'; el.className='toast'; document.body.appendChild(el); } return el; }
let toastTimer=null;
function showToast(message){ const el=ensureToast(); el.textContent=message; el.classList.add('show'); if(toastTimer) clearTimeout(toastTimer); toastTimer=setTimeout(() => el.classList.remove('show'), 1800); }
function toggleFavorite(id){ const key=String(id); const adding=!isFavorite(key); if(adding){ state.favorites.push(key); } else { state.favorites = state.favorites.filter(v => v !== key); } saveFavorites(); render(); showToast(adding ? 'マイ予定に追加しました' : 'マイ予定から外しました'); }
function categoryClass(category){ return ({'講演':'c-lecture','シンポジウム':'c-sympo','ディベート':'c-debate','一般演題':'c-general','プレセミナー':'c-pre','ポスター':'c-poster','式典':'c-ceremony','その他':'c-other'})[category] || 'c-ceremony'; }
function getFloorFromRoom(room){ room = room || ''; if(room.includes('国際会議場')) return '3F'; if(room.includes('小ホール') || room.includes('多目的ホール')) return '1F'; if(room.includes('501')) return '5F'; if(room.includes('601') || room.includes('602')) return '6F'; return ''; }

function ensureResourceViewer(){ let overlay=document.getElementById('resourceViewer'); if(!overlay){ overlay=document.createElement('div'); overlay.id='resourceViewer'; overlay.className='viewer-overlay'; overlay.innerHTML='<div class="viewer-panel"><div class="viewer-toolbar"><div class="viewer-title" id="resourceViewerTitle">資料ビューア</div><div class="viewer-actions"><a id="resourceViewerOpenNew" class="viewer-btn" href="#" target="_blank" rel="noopener noreferrer">新しいタブで開く</a><button type="button" id="resourceViewerClose" class="viewer-btn close">閉じる</button></div></div><div class="viewer-frame-wrap"><iframe id="resourceViewerFrame" class="viewer-frame" title="資料ビューア"></iframe></div></div>'; overlay.addEventListener('click', function(e){ if(e.target===overlay) closeResourceViewer(); }); document.body.appendChild(overlay); document.getElementById('resourceViewerClose').addEventListener('click', closeResourceViewer); } return overlay; }
function closeResourceViewer(){ const overlay=document.getElementById('resourceViewer'); const frame=document.getElementById('resourceViewerFrame'); if(frame) frame.src='about:blank'; if(overlay) overlay.classList.remove('show'); }
function isPdfUrl(url){ return /\.pdf(?:$|[#?])/i.test(String(url||'')); }
function openPdfInApp(url, label){ ensureResourceViewer(); const overlay=document.getElementById('resourceViewer'); const frame=document.getElementById('resourceViewerFrame'); const title=document.getElementById('resourceViewerTitle'); const openNew=document.getElementById('resourceViewerOpenNew'); if(title) title.textContent=(label||'資料ビューア'); if(openNew){ openNew.href=url; openNew.setAttribute('aria-label',(label||'資料')+'を新しいタブで開く'); } if(frame) frame.src=url; overlay.classList.add('show'); }
function openResource(url, label){ if(isPdfUrl(url)){ openPdfInApp(url, label); return; } try { const w = window.open(url, '_blank', 'noopener,noreferrer'); if(!w){ window.location.href = url; } } catch(e){ window.location.href = url; } }

function abstractBelongsToDay(item){ const hay = normalizeText([item.slot,item.session,item.room,item.preview].join(' ')); const isDay2 = state.date===DAY_MAP['2']; if(isDay2) return hay.includes('8月30日') || hay.includes('8/30') || hay.includes('day2'); return hay.includes('8月29日') || hay.includes('8/29') || hay.includes('day1'); }

function renderDateSwitch(){ const el=document.getElementById('dateSwitch'); const show=['schedule','favorites','map','abstracts'].includes(state.tab); el.style.display=show?'inline-flex':'none'; if(!show){ el.innerHTML=''; return; } const dates=['Day 1 (8/29)','Day 2 (8/30)']; el.innerHTML=dates.map(d => '<button type="button" class="seg-btn '+(state.date===d?'active':'')+'" onclick="setDate(\''+d+'\')">'+escapeHtml(d)+'</button>').join(''); }

function updateSearchHint(){ const labels={schedule:'日程表を検索中',favorites:'マイ予定を検索中',map:'会場情報を検索中',abstracts:'抄録インデックスを検索中',faq:'FAQを検索中',info:'大会案内を検索中'}; document.getElementById('searchHint').textContent = labels[state.tab] || '検索'; }
function filteredPrograms(favs){ const q=globalQuery(); return programData.filter(p => { const matchDate=p.date===state.date; const matchFav=favs?isFavorite(p.id):true; const floor=getFloorFromRoom(p.room); const hay=normalizeText([p.title,p.speaker,p.room,p.category,p.date,floor].join(' ')); const matchQ=!q || hay.includes(q); return matchDate && matchFav && matchQ; }); }

function renderProgramList(items, emptyText){ if(!items.length) return '<div class="empty">'+emptyText+'</div>'; return '<div class="program-list">'+items.map(p => { const floor=getFloorFromRoom(p.room); return '<div class="program-card"><div class="meta-row"><span class="pill '+categoryClass(p.category)+'">'+escapeHtml(p.category)+'</span><span class="pill time-pill">🕒 '+escapeHtml(p.time)+'</span>'+(floor?'<span class="pill floor-pill">'+escapeHtml(floor)+'</span>':'')+'</div><h3 class="program-title">'+escapeHtml(p.title)+'</h3>'+(p.speaker?'<div class="program-speaker">'+escapeHtml(p.speaker)+'</div>':'')+'<div class="program-room">📍 '+escapeHtml(p.room)+'</div><div class="action-row">'+favoriteActionHtml(p.id)+'</div></div>'; }).join('')+'</div>'; }
function getFavoriteAbstracts(){ const q=globalQuery(); return abstractData.filter(a => { const key=normalizeAbstractId(a.id); const matchFav=isFavorite(key); const matchDate=abstractBelongsToDay(a); const matchQ=!q || normalizeText([a.id,a.title,a.authors,a.keywords,a.session,a.room,a.preview,a.kind].join(' ')).includes(q); return matchFav && matchDate && matchQ; }); }

function renderSchedulePage(){ const items=filteredPrograms(false); document.getElementById('page-schedule').innerHTML = '<div class="stack"><div class="card section-card"><h3 class="card-title">マイ予定の使い方</h3><div class="muted">各プログラムの <strong>「☆ マイ予定に追加」</strong> を押すと、あとで <strong>「マイ予定」</strong> タブにまとめて確認できます。追加後は <strong>「★ 追加済み」</strong> に変わります。</div></div>'+renderProgramList(items, '該当するプログラムが見つかりません')+'</div>'; }
function renderFavoritesPage(){ const programs=filteredPrograms(true); const abstracts=getFavoriteAbstracts(); const count=programs.length+abstracts.length; const empty=(count===0); document.getElementById('page-favorites').innerHTML = '<div class="stack"><div class="card section-card"><h3 class="card-title">マイ予定</h3><div class="muted">日程表や抄録で <strong>「マイ予定に追加」</strong> を押した項目がここに表示されます。現在表示中の '+escapeHtml(state.date)+' の保存件数: <strong>'+escapeHtml(String(count))+'件</strong></div></div>'+(empty?'<div class="empty">まだ保存した項目はありません。日程表または抄録タブで <strong>「マイ予定に追加」</strong> を押してください。</div>':'<div class="card"><h3 class="card-title">保存したプログラム</h3><div class="muted">日程表から保存したセッションです。</div></div>'+renderProgramList(programs, 'この日の保存済みプログラムはありません')+'<div class="card"><h3 class="card-title">保存した抄録</h3><div class="muted">抄録タブから保存した演題です。</div></div>'+renderFavoriteAbstractList(abstracts, 'この日の保存済み抄録はありません'))+'</div>'; }
function renderMapPage(){ const q=''; const floors=['1F','3F','5F','6F']; const floorButtons=floors.map(f => '<button class="chip '+(state.floor===f?'active':'')+'" onclick="setFloor(\''+f+'\')">'+f+'</button>').join(''); const floorItems=(venueData[state.floor] || []).filter(v => !q || normalizeText(v.title+' '+v.desc+' '+state.floor).includes(q)); const sessions=programData.filter(p => p.date===state.date && getFloorFromRoom(p.room)===state.floor && (!q || normalizeText([p.title,p.room,p.speaker,p.category].join(' ')).includes(q))); const left = '<div class="stack"><div class="card"><h3 class="card-title">くにびきメッセ フロアガイド</h3><div class="muted">階ごとの会場構成を確認できます。日程と合わせて、どのフロアに移動するかを把握しやすくした確認用UIです。</div><div class="chip-row" style="margin-top:12px; margin-bottom:0;">'+floorButtons+'</div></div>'+(floorItems.length?'<div class="map-list">'+floorItems.map(v => '<div class="map-item"><h3 class="program-title">'+escapeHtml(v.title)+'</h3><div class="program-room">'+escapeHtml(v.desc)+'</div></div>').join('')+'</div>':'<div class="empty">該当する会場情報がありません</div>')+'</div>'; const right = '<div class="stack"><div class="card"><h3 class="card-title">'+escapeHtml(state.date)+' / '+escapeHtml(state.floor)+' の開催セッション</h3><div class="muted">現在のフロアに割り当てられているプログラムを表示します。</div></div>'+(sessions.length?'<div class="info-list">'+sessions.map(p => '<div class="info-item"><div class="meta-row"><span class="pill '+categoryClass(p.category)+'">'+escapeHtml(p.category)+'</span><span class="pill time-pill">'+escapeHtml(p.time)+'</span></div><h3 class="program-title">'+escapeHtml(p.title)+'</h3><div class="program-room">'+escapeHtml(p.room)+'</div></div>').join('')+'</div>':'<div class="empty">このフロアの該当セッションはありません</div>')+'</div>'; document.getElementById('page-map').innerHTML = '<div class="grid2">'+left+right+'</div>'; }
function filterAbstracts(){ const q=globalQuery(); return abstractData.filter(a => { const matchDate = abstractBelongsToDay(a); const matchQ = !q || normalizeText([a.id,a.title,a.authors,a.keywords,a.session,a.room,a.preview,a.kind].join(' ')).includes(q); return matchDate && matchQ; }); }
function renderAbstractsPage(){ const items=filterAbstracts(); document.getElementById('page-abstracts').innerHTML = '<div class="stack"><div class="card section-card"><h3 class="card-title">抄録の使い方</h3><div class="muted">抄録でも <strong>「☆ マイ予定に追加」</strong> を押すと、<strong>「マイ予定」</strong> タブに保存できます。掲載ページを確認したいときは、PDFボタンも使えます。</div><div class="chip-row" style="margin-top:12px; margin-bottom:0;"><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.endai, \'演題抄録集\')">演題抄録集を開く</button><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.shoroku, \'抄録集\')">抄録集を開く</button><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.kigyotenji, \'企業展示抄録\')">企業展示抄録を開く</button></div></div>'+(items.length?'<div class="abstract-list">'+items.map(a => { const key=normalizeAbstractId(a.id); return '<div class="abstract-item"><div class="meta-row"><span class="pill '+(a.kind==='口述'?'c-general':'c-poster')+'">'+escapeHtml(a.kind)+'</span><span class="pill time-pill">'+escapeHtml(key)+'</span>'+(ABSTRACT_PDF_PAGE_MAP[key]?'<span class="pill time-pill">PDF p.'+escapeHtml(String(ABSTRACT_PDF_PAGE_MAP[key]))+'</span>':'')+'</div><h3 class="program-title">'+escapeHtml(a.title)+'</h3>'+(a.authors?'<div class="abstract-meta">'+escapeHtml(a.authors)+'</div>':'')+(a.keywords?'<div class="program-room">Key words: '+escapeHtml(a.keywords)+'</div>':'')+(a.session?'<div class="program-room">'+escapeHtml(a.session)+'</div>':'')+(a.room?'<div class="program-room">📍 '+escapeHtml(a.room)+'</div>':'')+(a.preview?'<div class="abstract-preview">'+escapeHtml(a.preview)+'</div>':'')+'<div class="action-row">'+favoriteActionHtml(key)+'<button type="button" class="link-btn" onclick="openAbstractPdfPage(\''+escapeHtml(key)+'\')">この演題の掲載ページ付近を開く</button></div></div>'; }).join('')+'</div>':'<div class="empty">該当する抄録インデックスが見つかりません</div>')+'</div>'; }
function filterFaqs(){ const q=globalQuery(); return faqData.filter(item => { const catOK = state.faqCategory==='all' || item.category===state.faqCategory; const hay=normalizeText([item.id,item.category,item.type,item.question].concat(item.aliases||[]).concat([item.answer]).join(' ')); return catOK && (!q || hay.includes(q)); }); }
function renderFaqPage(){ const categories=['all'].concat(Array.from(new Set(faqData.map(f => f.category).filter(Boolean)))); const chips=categories.map(c => '<button class="chip '+(state.faqCategory===c?'active':'')+'" onclick="setFaqCategory('+JSON.stringify(c)+')">'+escapeHtml(c==='all'?'すべて':c)+'</button>').join(''); const items=filterFaqs(); document.getElementById('page-faq').innerHTML = '<div class="stack"><div class="card"><h3 class="card-title">学会公式チャットボット / よくある質問</h3><div class="muted">学会で想定されるよくある質問をもとにした案内ビューです。代表質問だけでなく、言い換え表現も対象に検索できます。</div><div class="chip-row" style="margin-top:12px; margin-bottom:0;">'+chips+'</div></div>'+(items.length?'<div class="faq-list">'+items.map(item => '<div class="faq-item"><div class="meta-row"><span class="pill c-lecture">'+escapeHtml(item.id)+'</span><span class="pill time-pill">'+escapeHtml(item.category)+'</span></div><h3 class="program-title">'+escapeHtml(item.question)+'</h3>'+((item.aliases||[]).filter(Boolean).length?'<div class="faq-meta">言い換え: '+escapeHtml((item.aliases||[]).filter(Boolean).join(' / '))+'</div>':'')+'<div class="faq-answer">'+nl2br(item.answer)+'</div></div>').join('')+'</div>':'<div class="empty">該当するFAQが見つかりません</div>')+'<div class="notice">個別の事情を含むご相談は、公式サイトの「お問い合わせ」または事務局メールへご案内する運用が安全です。</div></div>'; }
function renderInfoPage(){ const q=globalQuery(); const sections=Object.entries(participantGuide).filter(pair => !q || normalizeText([pair[0]].concat(pair[1]).join(' ')).includes(q)); document.getElementById('page-info').innerHTML = '<div class="stack"><div class="card"><h3 class="card-title">大会案内</h3><div class="muted">参加費、申込期限、オンデマンド参加、申込方法、注意事項の要点をまとめています。</div><div class="chip-row" style="margin-top:12px; margin-bottom:0;"><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.shoroku, \'抄録集\')">抄録集を開く</button><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.endai, \'演題抄録集\')">演題抄録集を開く</button><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.kigyotenji, \'企業展示抄録\')">企業展示抄録を開く</button><button type="button" class="link-btn" onclick="openResource(PDF_LINKS.official, \'公式サイト\')">公式サイト</button></div></div>'+(sections.length?'<div class="info-list">'+sections.map(function(sec){ return '<div class="info-item"><h3 class="program-title">'+escapeHtml(sec[0])+'</h3><div class="program-room"><ul style="margin:8px 0 0 18px; padding:0; line-height:1.8;">'+sec[1].map(v => '<li>'+escapeHtml(v)+'</li>').join('')+'</ul></div></div>'; }).join('')+'</div>':'<div class="empty">該当する案内項目が見つかりません</div>')+'<div class="notice">オンデマンド参加のみでは生涯学習ポイント付与がない点、現地参加者はオンデマンド登録追加不要な点は特に見落とされやすい重要事項です。</div></div>'; }
